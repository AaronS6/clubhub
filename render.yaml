# Render Blueprint — ClubHub
# This file deploys the app + realtime worker to Render's free tier.
# The database is hosted on Supabase (free, no 90-day deletion) — see DEPLOY.md.
#
# After deploying, set these environment variables in the Render dashboard:
#   - DATABASE_URL (from Supabase)
#   - NEXTAUTH_SECRET (generate)
#   - REALTIME_TOKEN (generate, same in both services)
#   - NEXT_PUBLIC_REALTIME_URL (the realtime service's public URL)

services:
  # --- Realtime socket.io web service (free tier, public URL) ----------------
  # Runs as a Web Service (not Worker) so it gets a public URL for browser
  # WebSocket connections.
  - type: web
    name: clubhub-realtime
    env: docker
    dockerContext: mini-services/realtime
    dockerfilePath: ./mini-services/realtime/Dockerfile
    plan: free
    envVars:
      - key: REALTIME_TOKEN
        generateValue: true
      - key: EMIT_PORT
        value: "3004"
      - key: PORT
        value: "3003"

  # --- Next.js web service (free tier) ---------------------------------------
  - type: web
    name: clubhub-web
    env: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        sync: false # set manually from Supabase
      - key: NEXTAUTH_SECRET
        generateValue: true
      - key: NEXTAUTH_URL
        value: https://clubhub-web.onrender.com
      - key: ADMIN_CLUB_PASSCODE
        value: buildtogether12$
      - key: REALTIME_TOKEN
        fromService:
          type: web
          name: clubhub-realtime
          envVarKey: REALTIME_TOKEN
      - key: REALTIME_EMIT_URL
        value: http://clubhub-realtime:3004/emit
      - key: NEXT_PUBLIC_REALTIME_URL
        sync: false # set manually to the realtime service's public URL
      - key: NODE_ENV
        value: production
