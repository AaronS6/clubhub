# Render Blueprint — ClubHub (Single Service)
# Deploys ONLY the Next.js web service. Realtime push is disabled — the app
# uses polling (5-30s intervals) which is plenty fast for a club app.
# To enable realtime later, deploy the realtime service separately and add
# the realtime env vars (see the "Enable Realtime Later" section in DEPLOY.md).

services:
  - type: web
    name: clubhub-web
    env: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        sync: false # set manually from Supabase
      - key: NEXTAUTH_SECRET
        generateValue: true
      - key: NEXTAUTH_URL
        value: https://clubhub-web.onrender.com
      - key: ADMIN_CLUB_PASSCODE
        sync: false # set manually in Render dashboard — do NOT hardcode secrets in YAML
      - key: NODE_ENV
        value: production
