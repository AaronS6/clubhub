# Render Blueprint — ClubHub
# This file lets you deploy the entire app to Render in one click via
# "New > Blueprint" in the Render dashboard. All services use the FREE tier.
#
# After deploying, set these environment variables in the Render dashboard
# (the blueprint sets placeholders — you fill in the real values):
#   - NEXTAUTH_SECRET (generate: `openssl rand -base64 32`)
#   - ADMIN_CLUB_PASSCODE (default: buildtogether12$)
#   - REALTIME_TOKEN (generate a random string)

services:
  # --- PostgreSQL database (free tier, 1GB, 90 days) -------------------------
  - type: pserv
    name: clubhub-db
    env: docker
    repo: https://github.com/render-examples/postgresql
    plan: free
    ipAllowList: [] # allow all (the app authenticates via connection string)

  # --- Realtime socket.io background worker (free tier) ----------------------
  # Runs the mini-services/realtime service. Exposes the WebSocket port
  # publicly (PORT) so browsers can connect. The emit API runs on EMIT_PORT
  # internally (reachable by the web service via the worker's internal hostname).
  - type: worker
    name: clubhub-realtime
    env: docker
    dockerContext: mini-services/realtime
    dockerfilePath: ./mini-services/realtime/Dockerfile
    plan: free
    envVars:
      - key: REALTIME_TOKEN
        generateValue: true
      - key: EMIT_PORT
        value: "3004"
      - key: PORT
        value: "3003"

  # --- Next.js web service (free tier) ---------------------------------------
  - type: web
    name: clubhub-web
    env: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: clubhub-db
          property: connectionString
      - key: NEXTAUTH_SECRET
        generateValue: true
      - key: NEXTAUTH_URL
        # Render sets this automatically, but we set it explicitly for NextAuth.
        value: https://clubhub-web.onrender.com
      - key: ADMIN_CLUB_PASSCODE
        value: buildtogether12$
      - key: REALTIME_TOKEN
        fromService:
          type: worker
          name: clubhub-realtime
          envVarKey: REALTIME_TOKEN
      - key: REALTIME_EMIT_URL
        value: http://clubhub-realtime:3004/emit
      - key: NEXT_PUBLIC_REALTIME_URL
        value: wss://clubhub-realtime.onrender.com
      - key: NODE_ENV
        value: production
