<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B8A5F"/>
      <stop offset="100%" stop-color="#066B4A"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <!-- Stylized "C" formed by three people/figures in a circle -->
  <circle cx="32" cy="24" r="5" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-dasharray="70 100" stroke-dashoffset="-18" transform="rotate(-90 32 32)"/>
  <!-- Three dots representing members -->
  <circle cx="32" cy="16" r="3" fill="#fff"/>
  <circle cx="22" cy="38" r="3" fill="#fff"/>
  <circle cx="42" cy="38" r="3" fill="#fff"/>
</svg>
